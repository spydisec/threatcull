# ThreatCull Catalog: public threat feeds ThreatCull can fetch. Each operator
# decides which Sources to use; ThreatCull downloads them from their publishers.
# family: Sources from the same upstream share a family and count once in scoring.
# revision: raise it by one with every change. ThreatCull uses the newest revision
# it has: the one it shipped with, or one saved by `threatcull catalog update`.
# requires: the oldest ThreatCull version that understands this file.
revision: 4
requires: "2.0.0"
sources:
