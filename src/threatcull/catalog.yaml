    name: abuse.ch Feodo Tracker botnet C2 IPs
    family: abuse-ch
    url: https://feodotracker.abuse.ch/downloads/ipblocklist.txt
    format: plain
    kind: ip
    category: c2
    refresh_minutes: 60
    default_enabled: true

