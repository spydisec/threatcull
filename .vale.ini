StylesPath = .vale/styles
MinAlertLevel = warning
Packages = write-good, proselint
Vocab = ThreatCull

[*.md]
BasedOnStyles = Vale, write-good, proselint, ThreatCull
write-good.Passive = NO
write-good.E-Prime = NO
write-good.TooWordy = warning
# The docs use straight quotes; proselint added this rule as an error in November 2026.
proselint.CurlyQuotes = NO
# Fires on a wrapped line that starts with "so" mid-sentence.
write-good.So = warning
