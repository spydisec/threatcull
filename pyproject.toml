[project]
name = "threatcull"
version = "0.1.0"
description = "Self-hosted threat-feed compiler: cull the noise, block the threats."
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.12"
dependencies = [
    "apscheduler>=3.10,<4",
    "argon2-cffi>=25.1.0",
    "fastapi>=0.141.1",
    "httpx>=0.28",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "pydantic>=2.9",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.2",
    "uvicorn>=0.53.0",
]

[project.scripts]
threatcull = "threatcull.cli:main"

[dependency-groups]
dev = [
    "bandit>=1.8",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/threatcull"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "S", "PL", "RUF", "PT", "N", "C4", "DTZ", "PTH", "TRY", "ERA"]
ignore = ["PLR0913", "TRY003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "S310", "PLR0915"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]
mypy_path = "src"
explicit_package_bases = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers -m 'not network'"
testpaths = ["tests"]
markers = ["network: reaches real upstream URLs (run explicitly with -m network)"]

[tool.coverage.run]
source = ["threatcull"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
