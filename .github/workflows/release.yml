name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write # publish the GitHub release with the CHANGELOG.md notes
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The tag is the version. A release made in the GitHub Release UI does not bump
      # pyproject.toml, so the build uses the tag's version and says so instead of
      # failing; the next pull request should bump pyproject.toml to match.
      - name: Version from the tag
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=${TAG#v}
          # X.Y.Z, or a Python pre-release: X.Y.ZaN, X.Y.ZbN or X.Y.ZrcN.
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+((a|b|rc)[0-9]+)?$ ]]; then
            echo "tag $TAG is not vX.Y.Z, vX.Y.ZaN, vX.Y.ZbN or vX.Y.ZrcN" >&2
            exit 1
          fi
          project=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if [ "$project" != "$version" ]; then
            echo "::warning::pyproject.toml says $project; building $version from the tag. Bump pyproject.toml in the next pull request."
            sed -i "0,/^version = \".*\"/s//version = \"$version\"/" pyproject.toml
          fi
          image=ghcr.io/spydisec/threatcull
          tags="$image:$version"
          # Only a plain X.Y.Z release moves :X.Y, :X and :latest; a pre-release
          # (for example 1.1.0rc1) gets its exact tag only.
          if [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            tags+=$'\n'"$image:${version%.*}"$'\n'"$image:${version%%.*}"$'\n'"$image:latest"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          {
            echo "tags<<TAGS_EOF"
            echo "$tags"
            echo "TAGS_EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Release notes from CHANGELOG.md, if it has this version
        id: notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::CHANGELOG.md has no '## [$VERSION]' section; the release keeps its own notes."
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push (linux/amd64, linux/arm64)
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.version.outputs.version }}
          tags: ${{ steps.version.outputs.tags }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/spydisec/threatcull
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
          CHANGELOG_NOTES: ${{ steps.notes.outputs.found }}
        run: |
          notes=(--generate-notes)
          [ "$CHANGELOG_NOTES" = "true" ] && notes=(--notes-file "$RUNNER_TEMP/notes.md")
          flags=()
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || flags+=(--prerelease)
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # Made in the Release UI: keep its notes unless CHANGELOG.md has this version.
            if [ "$CHANGELOG_NOTES" = "true" ]; then
              gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$RUNNER_TEMP/notes.md"
            fi
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "ThreatCull $VERSION" "${notes[@]}" "${flags[@]}"
          fi
