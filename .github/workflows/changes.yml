name: Changes

# Called by the other workflows: which kinds of files a pull request or a push
# touches, so each job can skip work that the change cannot affect. A job skipped
# with `if:` still satisfies a required status check; a workflow-level `paths:`
# filter would leave the check pending and block the merge.
#
# A pull request is compared with its base, a push with the commit before it.
# Everything runs (every output "true") for schedules and manual runs, for a
# change to a workflow, for a new branch, and whenever the file list cannot be read.

on:
  workflow_call:
    outputs:
      python:
        description: Application code, tests, repo scripts or their dependencies changed
        value: ${{ jobs.changes.outputs.python }}
      docker:
        description: The image or anything built into it changed
        value: ${{ jobs.changes.outputs.docker }}
      dockerfile:
        description: Dockerfile or .dockerignore changed
        value: ${{ jobs.changes.outputs.dockerfile }}
      frontend:
        description: The TypeScript islands or their bundle changed
        value: ${{ jobs.changes.outputs.frontend }}
      prose:
        description: Markdown or the Vale configuration changed
        value: ${{ jobs.changes.outputs.prose }}
      deps:
        description: pyproject.toml or uv.lock changed
        value: ${{ jobs.changes.outputs.deps }}

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      python: ${{ steps.filter.outputs.python }}
      docker: ${{ steps.filter.outputs.docker }}
      dockerfile: ${{ steps.filter.outputs.dockerfile }}
      frontend: ${{ steps.filter.outputs.frontend }}
      prose: ${{ steps.filter.outputs.prose }}
      deps: ${{ steps.filter.outputs.deps }}
    steps:
      - id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          all() {
            for name in python docker dockerfile frontend prose deps; do
              echo "$name=true" >> "$GITHUB_OUTPUT"
            done
            exit 0
          }
          case "$EVENT" in
            pull_request)
              files=$(gh pr diff "$PR" --repo "$REPO" --name-only) || all
              ;;
            push)
              # A new branch has no "before" commit (all zeros).
              [[ "$BEFORE" =~ ^0+$ ]] && all
              # The compare API lists at most 300 files: run everything past that.
              files=$(gh api "repos/$REPO/compare/$BEFORE...$AFTER" \
                --jq 'if (.files | length) >= 300 then error("too many files") else .files[].filename end') || all
              ;;
            *) all ;;
          esac
          printf '%s\n' "$files"
          grep -qE '^\.github/workflows/' <<< "$files" && all
          match() { grep -qE "$1" <<< "$files" && echo true || echo false; }
          app='^(src/|pyproject\.toml$|uv\.lock$|\.semgrep\.yml$)'
          dockerfile='^(Dockerfile|\.dockerignore)$'
          {
            echo "python=$(match "$app|^tests/|^scripts/.*\.py$")"
            echo "docker=$(match "$app|$dockerfile|^(docker-compose\.yaml|\.grype\.yaml|scripts/docker-smoke\.sh)$")"
            echo "dockerfile=$(match "$dockerfile")"
            echo "frontend=$(match '^frontend/|^src/threatcull/web/static/islands\.js$')"
            echo "prose=$(match '\.md$|^\.vale\.ini$|^\.vale/')"
            echo "deps=$(match '^(pyproject\.toml|uv\.lock)$')"
          } >> "$GITHUB_OUTPUT"
