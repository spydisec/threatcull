name: Docker

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    uses: $/.github/workflows/changes.yml
    permissions:
      contents: read
      pull-requests: read

  image:
    needs: changes
    # Runs when the change can affect it, and always if the changes check failed.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.docker == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: hadolint
        run: >-
          docker run --rm -i
          hadolint/hadolint:v2.15.1@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d
          < Dockerfile
      - name: Validate docker-compose.yaml
        run: docker compose -f docker-compose.yaml config --quiet
      - name: Build
        env:
          DOCKER_BUILDKIT: "1"
        run: docker build --build-arg VERSION=ci -t threatcull:ci .
      - name: Smoke test (no internet needed)
        run: scripts/docker-smoke.sh threatcull:ci
      # Fails the pull request on a high or critical CVE that already has a fix
      # (a base-image digest bump or a dependency update usually clears it).
      - name: Scan the image for known vulnerabilities (Grype)
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: threatcull:ci
          fail-build: true
          severity-cutoff: high
          only-fixed: true
          output-format: table

  # Releases publish arm64 too (Raspberry Pis): build it here so an arm64 problem
  # shows on the pull request, not on the release tag. Build only; no push, no run.
  arm64:
    needs: changes
    # Runs when the change can affect it, and always if the changes check failed.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.docker == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build linux/arm64
        run: docker buildx build --platform linux/arm64 --build-arg VERSION=ci .
