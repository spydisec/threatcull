name: Lint

# Pull requests, and pushes to dev (a merge can combine two pull requests that each
# passed alone). main only receives dev through a release pull request, which runs
# these checks first.
on:
  pull_request:
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    uses: $/.github/workflows/changes.yml
    permissions:
      contents: read
      pull-requests: read

  lint:
    needs: changes
    # Runs when the change can affect it, and always if the changes check failed.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.python == 'true' || needs.changes.outputs.prose == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - if: ${{ needs.changes.result != 'success' || needs.changes.outputs.python == 'true' }}
        run: uv sync --frozen
      - name: Ruff format
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.python == 'true' }}
        run: uv run ruff format --check .
      - name: Ruff lint
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.python == 'true' }}
        run: uv run ruff check .
      - name: mypy (strict)
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.python == 'true' }}
        run: uv run mypy # src, scripts and tests (pyproject.toml)
      - name: docs/CATALOG.md matches catalog.yaml
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.python == 'true' || needs.changes.outputs.prose == 'true' }}
        run: uv run python scripts/catalog_docs.py --check
      - name: Vale (prose in pushed Markdown)
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.prose == 'true' }}
        run: |
          uvx vale sync
          uvx vale README.md SECURITY.md CONTRIBUTING.md CHANGELOG.md docs/CATALOG.md .github

  # The offline suite (network tests stay deselected) on the oldest supported Python and
  # on the one the image ships.
  pytest:
    needs: changes
    # Runs when the change can affect it, and always if the changes check failed.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.python == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - run: uv sync --frozen
      - name: pytest (parallel, with coverage)
        run: uv run pytest -n auto --cov

  # One stable check name for the branch ruleset: passes when every pytest job passed
  # or all of them were skipped because the change cannot affect them.
  test:
    needs: pytest
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          RESULT: ${{ needs.pytest.result }}
        run: |
          echo "pytest: $RESULT"
          [ "$RESULT" = "success" ] || [ "$RESULT" = "skipped" ]

  islands:
    needs: changes
    # Runs when the change can affect it, and always if the changes check failed.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.frontend == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Typecheck and rebuild the TypeScript islands
        working-directory: frontend
        run: |
          npm ci --ignore-scripts
          npm run typecheck
          npm run build
      - name: Committed bundle is up to date
        run: git diff --exit-code -- src/threatcull/web/static/islands.js

  commitlint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Conventional Commits, subject <= 72 chars
        uses: wagoid/commitlint-github-action@b948419dd99f3fd78a6548d48f94e3df7f6bf3ed # v6.2.1
        with:
          configFile: ./commitlint.config.mjs
