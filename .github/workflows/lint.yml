name: Lint

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    uses: $/.github/workflows/changes.yml
    permissions:
      contents: read
      pull-requests: read

  lint:
    needs: changes
    # Runs when the change can affect it, and always if the changes check failed.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.python == 'true' || needs.changes.outputs.prose == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      - if: ${{ needs.changes.result != 'success' || needs.changes.outputs.python == 'true' }}
        run: uv sync --frozen
      - name: Ruff format
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.python == 'true' }}
        run: uv run ruff format --check .
      - name: Ruff lint
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.python == 'true' }}
        run: uv run ruff check .
      - name: mypy (strict)
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.python == 'true' }}
        run: uv run mypy src # tests/ is local only
      - name: docs/CATALOG.md matches catalog.yaml
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.python == 'true' || needs.changes.outputs.prose == 'true' }}
        run: uv run python scripts/catalog_docs.py --check
      - name: Vale (prose in pushed Markdown)
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.prose == 'true' }}
        run: |
          uvx vale sync
          uvx vale README.md SECURITY.md CONTRIBUTING.md CHANGELOG.md docs/CATALOG.md .github

  islands:
    needs: changes
    # Runs when the change can affect it, and always if the changes check failed.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.frontend == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Typecheck and rebuild the TypeScript islands
        working-directory: frontend
        run: |
          npm ci --ignore-scripts
          npm run typecheck
          npm run build
      - name: Committed bundle is up to date
        run: git diff --exit-code -- src/threatcull/web/static/islands.js

  commitlint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Conventional Commits, subject <= 72 chars
        uses: wagoid/commitlint-github-action@b948419dd99f3fd78a6548d48f94e3df7f6bf3ed # v6.2.1
        with:
          configFile: ./commitlint.config.mjs
