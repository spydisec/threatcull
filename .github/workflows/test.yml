name: Test

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A pull request that touches only docs or other non-code files skips the
  # tests. A skipped job still satisfies the required "test" check, which a
  # workflow-level paths filter would leave pending.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # If the file list cannot be read, run the tests rather than skip them.
          if ! files=$(gh pr diff "$PR" --repo "$REPO" --name-only); then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s\n' "$files"
          # Tests read src/ (code, catalog.yaml, templates, static), the Vale
          # config, and the project and lock files.
          pattern='^(src/|tests/|pyproject\.toml$|uv\.lock$|\.vale\.ini$|\.vale/|\.github/workflows/test\.yml$)'
          if grep -qE "$pattern" <<< "$files"; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Sync Vale styles (tests/test_prose_rules.py runs Vale directly)
        run: uvx vale sync
      - name: Tests (offline) with coverage floor
        run: uv run pytest --cov --cov-report=term-missing
