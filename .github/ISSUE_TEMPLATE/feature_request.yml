name: Feature request
description: Suggest a change or a new feature.
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What do you want to do that ThreatCull can't do today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How would you like it to work?
  - type: textarea
    id: suggested-fix
    attributes:
      label: Suggested fix (describe the idea; please don't paste code)
      description: >-
        Optional. Explain the idea behind a fix in words. The maintainer implements it, so code
        pasted here can't be used.
    validations:
      required: false
