name: Add a Source to the Catalog
description: Suggest a public blocklist or allowlist for the built-in Catalog.
title: "Catalog: "
labels: ["catalog", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        A bot downloads the feed within a few minutes, counts the entries ThreatCull would keep and
        comments with what it found. The project owner then reviews it; approval closes the issue and
        opens a pull request that adds the Source.
        See [docs/CATALOG.md](https://github.com/spydisec/threatcull/blob/main/docs/CATALOG.md)
        for what a Source needs.
  - type: input
    id: name
    attributes:
      label: Source name
      description: Publisher and list, as people know it.
      placeholder: "Example Security bad IPs (30 days)"
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Feed URL
      description: The raw list itself (https), not the project page.
      placeholder: "https://example.com/feeds/bad-ips.txt"
    validations:
      required: true
  - type: dropdown
    id: role
    attributes:
      label: List type
      options:
        - Blocklist
        - Allowlist
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: Contains
      options:
        - IPs and CIDRs
        - Domains
    validations:
      required: true
  - type: dropdown
    id: format
    attributes:
      label: Format
      description: plain is one value per line; hosts is "0.0.0.0 domain"; adblock is "||domain^".
      options:
        - plain
        - hosts
        - adblock
        - csv
        - json
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Category
      description: For allowlists, pick Infrastructure.
      options:
        - Malicious
        - C2
        - Scanners
        - Phishing
        - Spam / scam
        - Ads / tracking
        - Infrastructure
    validations:
      required: true
  - type: dropdown
    id: refresh
    attributes:
      label: Update frequency
      options:
        - Hourly
        - Daily
        - Weekly
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: What it covers, false-positive handling, CSV column or JSON keys if needed.
