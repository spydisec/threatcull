# SPDX-License-Identifier: AGPL-3.0-only
# Save as compose.yaml, put the first admin password in threatcull_admin.txt
# (chmod 644 so the container can read it), then run:
#   THREATCULL_BIND=<lan-ip> docker compose up -d
# After the first login, empty the file (: > threatcull_admin.txt) but keep it.
services:
  threatcull:
    # ":1" follows 1.x releases; pin ":1.0.0" to upgrade by hand.
    image: ghcr.io/spydisec/threatcull:1
    # build: .   # to build from a clone instead
    ports:
      # Published on loopback unless THREATCULL_BIND names a LAN address.
      - "${THREATCULL_BIND:-127.0.0.1}:6969:6969"
    volumes:
      - threatcull-data:/data
    environment:
      # Read on the first start only, to create 'admin'.
      THREATCULL_ADMIN_PASSWORD_FILE: /run/secrets/threatcull_admin
    secrets:
      - threatcull_admin
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"

volumes:
  threatcull-data:

secrets:
  threatcull_admin:
    file: ./threatcull_admin.txt
