# Run with `docker compose up -d`, or paste into a Portainer stack.
services:
  threatcull:
    image: ghcr.io/spydisec/threatcull:2
    container_name: threatcull
    ports:
      - "6969:6969" # use "127.0.0.1:6969:6969" to reach it from this host only
    volumes:
      - threatcull-data:/data
    environment:
      # Password for the 'admin' user (12+ characters). Used on the first start only.
      - THREATCULL_ADMIN_PASSWORD=
      # Timezone for times in the web UI, as an IANA name. Unset means UTC.
      # - TZ=Australia/Melbourne
    restart: unless-stopped
    # On a small host (a Raspberry Pi), cap memory so a very large list can't make
    # the whole machine unresponsive. See "Sizing" in the README.
    # mem_limit: 1g
    # ThreatCull runs as a non-root user on an unprivileged port: it needs no
    # Linux capabilities and never gains privileges.
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

volumes:
  threatcull-data: {}
