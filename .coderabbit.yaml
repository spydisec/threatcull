# CodeRabbit configuration for ThreatCull
# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
#
# Reviews focus on security and correctness in the application code, workflows and
# container. CI already runs ruff, mypy, pytest, bandit, semgrep, pip-audit, gitleaks,
# Vale and hadolint, so style linters stay off here. The test suite is not in the repo.

language: "en-GB"

tone_instructions: >-
  Be direct. Report only real problems: security, correctness, data loss, broken
  upgrades. Skip style, naming, praise and summaries of what the code does.

chat:
  art: false
  auto_reply: true

knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - "CONTRIBUTING.md"
      - "SECURITY.md"

reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  collapse_walkthrough: true
  changed_files_summary: false
  sequence_diagrams: false
  estimate_code_review_effort: false
  poem: false
  in_progress_fortune: false
  suggested_labels: false
  suggested_reviewers: false
  review_status: true
  # Contributions here are often written with AI help; judge the change, not its author.
  slop_detection:
    enabled: false

  auto_review:
    enabled: true
    drafts: false
    auto_incremental_review: true
    base_branches:
      - "dev"
      - "main"
    # dev -> main release PRs carry commits already reviewed on their way into dev.
    ignore_title_keywords:
      - "release:"
      - "chore(release)"
      - "WIP"
    ignore_usernames:
      - "dependabot[bot]"

  # Out of scope: tests, generated or vendored files, lock files and prose (Vale
  # checks the prose in CI).
  path_filters:
    - "!tests/**"
    - "!**/*.md"
    - "!uv.lock"
    - "!frontend/package-lock.json"
    - "!src/threatcull/web/static/islands.js"
    - "!src/threatcull/web/static/htmx.min.js"
    - "!src/threatcull/web/static/*.LICENSE"
    - "!.vale/**"
    - "!.github/ISSUE_TEMPLATE/**"

  path_instructions:
    - path: "src/threatcull/**/*.py"
      instructions: |
        ThreatCull downloads untrusted feeds from the internet and serves the result to
        firewalls and DNS servers. Look for:
        - SQL built with f-strings, % or +: every query must be parameterised.
        - Untrusted input (feed content, uploads, config and Catalog YAML, form fields,
          headers) reaching file paths, shell, YAML loaders other than safe/no-alias,
          HTML without escaping, or Output headers without control-character checks.
        - Anything that could put private, special-purpose or allowlisted addresses into
          an Output, or drop the Shrink Guard, Feed Token or CSRF checks.
        - Auth: every write route needs CSRF and login; API writes need a token or CSRF
          header; Feed Tokens are compared in constant time and never logged.
        - SQLite: long write transactions block the web UI; writes go through
          store.db.transaction.
        - Upgrades: a migration must work on an existing database; config import must
          stay backwards compatible.
        Do not comment on formatting, typing style or docstrings: ruff and mypy strict
        run in CI.
    - path: "src/threatcull/web/templates/**"
      instructions: |
        - The CSP is default-src 'self': no inline scripts, inline styles or style
          attributes. Data for scripts goes in <script type="application/json">.
        - Jinja autoescape is on; flag any |safe or Markup built from user data.
        - Every POST form needs the csrf hidden field.
    - path: "frontend/src/**"
      instructions: |
        - Islands only: small TypeScript enhancements to server-rendered pages; no
          framework. Flag innerHTML with data from the page or the network.
        - The bundle in src/threatcull/web/static/islands.js is generated by `make ui`.
    - path: "src/threatcull/catalog.yaml"
      instructions: |
        - Every Source needs licence evidence: licence text and a licence_url on the
          provider's own site. default_enabled blocklists need business_use: allowed.
        - A change to any Source needs a higher revision.
        - Flag duplicate URLs and non-https feed URLs.
    - path: ".github/workflows/**"
      instructions: |
        - Actions are pinned by full commit SHA with the version in a comment.
        - Least-privilege permissions per job; flag any broadening, pull_request_target,
          or untrusted input (titles, branch names) expanded directly in run: scripts.
    - path: "Dockerfile"
      instructions: |
        - Base images pinned by digest; the runtime stage runs as uid 10001 and holds no
          build tools, secrets or threat data.
    - path: "docker-compose.yaml"
      instructions: |
        - Must stay a single plain file that works when pasted into a Portainer stack.
        - Never commit a real password; THREATCULL_ADMIN_PASSWORD stays empty.

  # Security scanners only. CI already runs ruff, bandit, semgrep, gitleaks, Vale and
  # hadolint on every pull request; the duplicates here add review comments, not safety.
  tools:
    gitleaks:
      enabled: true
    osvScanner:
      enabled: true
    zizmor:
      enabled: true
    actionlint:
      enabled: true
    hadolint:
      enabled: true
    shellcheck:
      enabled: true
    semgrep:
      enabled: true
      config_file: ".semgrep.yml"
    github-checks:
      enabled: true
    ruff:
      enabled: false
    pylint:
      enabled: false
    flake8:
      enabled: false
    markdownlint:
      enabled: false
    languagetool:
      enabled: false
    vale:
      enabled: false
    yamllint:
      enabled: false
    biome:
      enabled: false
    eslint:
      enabled: false
    oxc:
      enabled: false
    htmlhint:
      enabled: false
    stylelint:
      enabled: false
    checkov:
      enabled: false
    trivy:
      enabled: false
    trufflehog:
      enabled: false
    opengrep:
      enabled: false
    ast-grep:
      enabled: false
      essential_rules: false
    dotenvLint:
      enabled: false
    sqlfluff:
      enabled: false
    presidio:
      enabled: false

  finishing_touches:
    unit_tests:
      enabled: false
    docstrings:
      enabled: false
    simplify:
      enabled: false
    autofix:
      enabled: false

  pre_merge_checks:
    docstrings:
      mode: "off"
    description:
      mode: "off"
    issue_assessment:
      mode: "off"
    title:
      mode: "warning"
      requirements: >-
        Conventional Commits (feat, fix, docs, ci, chore, test, refactor, build),
        72 characters or fewer.
